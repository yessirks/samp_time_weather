[TimeWeather]
; 1 = remember your last choice and apply it again the next time you start the game
Remember=1
; 1 = write TimeWeather.log next to the .asi (for bug reports)
Log=0

; Key bindings. Write a key name, optionally with Ctrl+ / Shift+ / Alt+ in front (for example Ctrl+F9).
;   Key names: F1..F24, A..Z, 0..9, Numpad0..Numpad9, Up, Down, Left, Right, Enter, Backspace, Space, Tab, Insert, Delete,
;   Home, End, PageUp, PageDown, Num+, Num-, Num*, Num/, [ ] ; ' , . - = / \ `, Mouse4, Mouse5,
;   or a Windows virtual-key number (for example 120 or 0x78 for F9).
; An empty value or "none" switches a key off.
[Keys]
; the panel
Open=F9
Up=Up
Down=Down
Left=Left
Right=Right
Select=Enter
GiveBack=Backspace

; Optional quick keys that work WITHOUT opening the panel (off until you give them a key).
; Pick keys SA-MP and your other mods do not use. Example:  SinglePlayerStyle=F10   WeatherNext=Home   WeatherPrevious=End
HourForward=none
HourBack=none
WeatherNext=none
WeatherPrevious=none
; a game day in 24 minutes and the weather changing by itself, like single-player
SinglePlayerStyle=none
; give the time and the weather back to the server
AllToServer=none
